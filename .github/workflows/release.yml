name: Release

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
      - 'images/**'
      - 'assets/**'
      - 'docs/**'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.gif'
      - '.gitattributes'
      - '.gitignore'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --bump
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Set Release Tag Output
        id: vars
        run: |
          RAW_VER="${{ steps.git-cliff.outputs.version }}"
          if [ -z "$RAW_VER" ]; then
            TAG="v1.0.0"
          elif [[ "$RAW_VER" == v* ]]; then
            TAG="$RAW_VER"
          else
            TAG="v$RAW_VER"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md
          fi

      - name: Package AddOn Archive (HunterAIO.zip)
        run: |
          mkdir -p dist/HunterAIO
          cp -r Bindings.xml HunterAIO.lua HunterAIO.toc README.md dist/HunterAIO/
          cd dist
          zip -r ../HunterAIO.zip HunterAIO
          cd ..
          echo "Created HunterAIO.zip archive"
          unzip -l HunterAIO.zip

      - name: Create and Push Git Tag
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: HunterAIO ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: HunterAIO.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
